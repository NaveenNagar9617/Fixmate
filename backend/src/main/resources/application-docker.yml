spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:hostel_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:changeme}

  data:
    redis:
      host: redis
      port: 6379

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 900000
    refresh-expiration: 604800000
  minio:
    url: http://minio:9000
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: fixmate
    presigned-url-expiry: ${MINIO_PRESIGNED_URL_EXPIRY:3600}
  cors:
    allowed-origins: http://localhost,http://localhost:80
