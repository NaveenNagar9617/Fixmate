server:
  port: 8080

spring:
  application:
    name: fixmate-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/hostel_db
    username: postgres
    password: "Akshat123@#$"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:fixmate@example.com}
    password: ${MAIL_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:b3BlbnNlY3JldGtleWZvcmZpeG1hdGVhcHBsaWNhdGlvbjIwMjZzZWN1cml0eWtleXRoYXRpc2xvbmdlbm91Z2g=}
    expiration: 900000 # 15 minutes
    refresh-expiration: 604800000 # 7 days
  minio:
    url: ${MINIO_URL:http://localhost:9000}
    public-url: ${MINIO_PUBLIC_URL:${app.minio.url}}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:fixmate}
    presigned-url-expiry: ${MINIO_PRESIGNED_URL_EXPIRY:3600}
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.fixmate: DEBUG
    org.springframework.security: INFO
